project:
  name: nts_agent
  outputs_root: outputs
  random_seed: 42

runtime:
  pythonpath: src
  log_level: INFO
  save_events: true

data:
  base_dir: datasets
  max_samples_per_split: null

retrieval:
  top_k: 5

memory:
  persist_memory: false
  reuse_memory: true
  force_rebuild: false

llm:
  provider: qwen
  model: "Qwen/Qwen2.5-72B-Instruct"
  use_sglang: true
  base_url: "http://localhost:30000/v1"
  temperature: 0.0
  max_tokens: 2048
  retry:
    max_attempts: 3
    base_delay: 1.0
    max_delay: 30.0
