pipeline:
  name: inference_pipeline
  params:
    top_k: 5
    selected_channel_ids: [0, 1, 2, 3]
    # Restrict retrieval candidates to the query's own file/run (within-run
    # setting). Representation-agnostic: applies to whichever retrieval_agent is
    # configured below. "global" (default elsewhere) keeps cross-file retrieval.
    retrieval_scope: same_file
    llm:
      provider: qwen
      model: Qwen/Qwen3-14B
      use_sglang: true
      base_url: http://localhost:30000/v1
      temperature: 0.0
      max_tokens: 4096
      timeout: 6000
      retry:
        max_attempts: 3
        base_delay: 1.0
        max_delay: 30.0

components:
  task: anomaly_window
  channel_decomposer: channel_decomposer
  retrieval_agent: retrieval_agent_stat
  reasoner_agent: reasoner_agent
  aggregator_agent: aggregation_agent_anomaly

memory:
  build_before_inference: true
  memory_config: configs/pipelines/memory_build.yaml